name: Build installers

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build installer
        shell: bash
        run: |
          EXTRA=""
          export CSC_IDENTITY_AUTO_DISCOVERY=false
          if [ "${{ matrix.args }}" = "--win" ]; then
            if [ -n "$AZURE_CLIENT_SECRET" ] && [ -n "$AZURE_SIGN_ENDPOINT" ]; then
              echo "Signing Windows installer with Azure Trusted Signing"
              EXTRA="-c.win.azureSignOptions.endpoint=$AZURE_SIGN_ENDPOINT -c.win.azureSignOptions.codeSigningAccountName=$AZURE_SIGN_ACCOUNT -c.win.azureSignOptions.certificateProfileName=$AZURE_SIGN_PROFILE"
            elif [ -n "$WIN_CSC_LINK" ]; then
              echo "Signing Windows installer with code signing certificate"
              export CSC_LINK="$WIN_CSC_LINK" CSC_KEY_PASSWORD="$WIN_CSC_KEY_PASSWORD"
            else
              echo "No Windows signing secrets set; building an unsigned installer"
            fi
          fi
          npx electron-builder ${{ matrix.args }} --publish never $EXTRA
        env:
          # Windows signing is optional: leave these secrets unset for an unsigned build.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGN_ENDPOINT: ${{ secrets.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ secrets.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ secrets.AZURE_SIGN_PROFILE }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
